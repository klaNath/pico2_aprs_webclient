# Builds the app and publishes it to GitHub Pages.
#
# Manual only (Run workflow) until Pages is switched on for this repository: Settings > Pages >
# Source: GitHub Actions. A push-triggered run would fail on every push before that. When Pages
# is ready, add `push: { branches: [main] }` under `on:`.
#
# The site is public, even when the repository is private. Read docs/HANDOFF.md ("公開前") first.
name: Deploy to GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      # The build uses relative URLs (vite.config.ts), so it works under /<repository>/.
      - run: npm run build
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
